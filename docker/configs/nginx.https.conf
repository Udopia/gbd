events {}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	sendfile on;

	# Docker's embedded DNS; resolve the gbd upstream at request time instead of
	# aborting at startup when gbd isn't up yet.
	resolver 127.0.0.11 valid=30s ipv6=off;

	proxy_http_version 1.1;
	proxy_buffering off;
	proxy_set_header Host $host;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection "Upgrade";
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Host $host;
	proxy_set_header X-Forwarded-Port $server_port;
	proxy_set_header Proxy "";
	log_format combined_ip '$http_x_forwarded_for - $remote_user [$time_local] '
			'"$request" $status $body_bytes_sent '
			'"$http_referer" "$http_user_agent"';

	server {
		listen 80;
		listen [::]:80;
		access_log /awstats/access.log combined_ip;

		location ^~ /.well-known {
            root /etc/nginx/ssl/bot;
        }

		location / {
			return 301 https://$host$request_uri;
		}
	}

	server {
		listen 443 ssl;
		listen [::]:443 ssl;
		http2 on;
		access_log /awstats/access.log combined_ip;

		ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
		ssl_protocols TLSv1.2 TLSv1.3;
		ssl_prefer_server_ciphers off;
		ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
		ssl_session_cache shared:SSL:10m;
		ssl_session_timeout 1d;
		add_header Strict-Transport-Security "max-age=63072000" always;

		location / {
			set $gbd_upstream gbd;
			proxy_pass   http://$gbd_upstream:44071;
		}

		location /stats {
			alias /awstats/www;
			index awstats.__VIRTUAL_HOST__.html index.html;
			try_files $uri $uri/ index.html;
			auth_basic "Restricted area";
			auth_basic_user_file /awstats/htpasswd;
			access_log off;

			location /stats/icon {
				alias /usr/lib/awstats/icon;
			}
		}
	}
}
